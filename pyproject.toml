[project]
name = "decode-service"
version = "0.1.0"
description = "FastAPI service that verifies an OIDC id_token (RS256) and returns its decoded claims"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pyjwt[crypto]==2.9.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "respx==0.21.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
